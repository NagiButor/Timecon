[package]
name = "timecon"
version = "0.32.0"
edition = "2024"
description = "Offline-first day planner written in Rust and WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]
members = ["xtask"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
maud = "0.27"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.105"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "Node", "NodeList",
  "Event", "EventTarget", "MouseEvent", "SubmitEvent", "HtmlFormElement",
  "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "HtmlDialogElement",
  "HtmlImageElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "DomRect", "DomTokenList",
  "HtmlAnchorElement", "HtmlDetailsElement", "Storage", "Location", "History",
  "FormData", "File", "FileList", "Blob", "BlobPropertyBag", "Url", "UrlSearchParams",
  "Navigator", "Notification", "NotificationOptions", "NotificationPermission",
  "AudioContext", "AudioDestinationNode", "AudioNode", "AudioParam", "OscillatorNode", "GainNode",
  "Request", "RequestInit", "RequestMode", "Response", "Headers",
  "WebSocket", "MessageEvent", "CloseEvent", "BinaryType",
  "ServiceWorkerContainer", "ServiceWorkerGlobalScope", "WorkerGlobalScope",
  "ExtendableEvent", "ExtendableMessageEvent", "FetchEvent", "CacheStorage", "Cache",
  "Clients", "ServiceWorker", "ServiceWorkerRegistration", "console", "MediaQueryList"
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
